# Security headers for the SPA. Included in every location: an add_header inside a
# location replaces the server-level ones, so a server-level declaration alone would not
# reach /assets/ or the SPA fallback.
#
# Content-Security-Policy: same-origin scripts only, no inline scripts, no eval.
# Fonts are bundled, so no external host is allowed. Inline styles stay allowed because
# Svelte sets style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
